name: Feature request
description: Suggest an improvement or a missing capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like GraffKube to do?
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What are you trying to accomplish? What do you do today instead?
    validations:
      required: true
